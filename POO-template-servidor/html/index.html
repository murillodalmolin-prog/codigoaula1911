<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <script src="static/js/index.js"></script>
        <title>Teste</title>
    </head>
    <body>
        <form id="form-cadastro">
            <div>
                <label>ID</label>
                <input
                    type="text"
                    name="id"
                    id="id"
                    readonly
                >
            </div>
            <div>
                <label>Nome</label>
                <input type="text" name="nome" id="nome">
            </div>
            <div>
                <label>Idade</label>
                <input type="text" name="idade" id="idade">
            </div>
            <div>
                <button type="submit" id="btnEnviar">Salvar</button>
            </div>
        </form>

        <div id="lista">
            <table>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Idade</th>
                    <th>Editar</th>
                    <th>Excluir</th>
                </tr>
                <tbody id="corpo-tabela">
                    {% for pessoa in lista_pessoas%}
                    <tr>
                        <td>{{pessoa.id}}</td>
                        <td>{{pessoa.nome}}</td>
                        <td>{{pessoa.idade}}</td>
                        <td>
                            <button onclick="prepararEditarPessoa({{pessoa.id}})">Editar</button>
                        </td>
                        <td>
                            <button onclick="deletarPessoa({{pessoa.id}})">Excluir</button>
                        </td>
                    </tr>
                    {% endfor%}
                </tbody>
            </table>
        </div>
    </body>
</html>
